<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.reset.title">Choose a new password — The Monkey Business</title>
  <meta name="description" data-i18n-content="page.reset.desc" content="Set a new password for your account.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="assets/js/i18n-strings.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/loader.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/lang-switch.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="assets/js/supabase-client.js" defer></script>
  <script src="assets/js/auth-errors.js" defer></script>
  <script src="assets/js/password-toggle.js" defer></script>
  <script src="assets/js/reset-password.js" defer></script>
</head>
<body class="auth-body">

<div class="auth-shell">
  <a class="auth-brand" href="index.html">
    <img class="auth-brand-mark" src="assets/images/logo-mark.png" alt="">
    <span>The Monkey Business</span>
  </a>

  <div class="auth-card">
    <h1 data-i18n="reset.title">Choose a new password</h1>
    <p class="auth-sub" id="resetSub" data-i18n="reset.checking">Checking your reset link…</p>

    <form class="auth-form" id="resetForm" hidden>
      <label class="field">
        <span data-i18n="reset.newPassword">New password</span>
        <div class="password-field">
          <input type="password" name="password" placeholder="At least 8 characters" data-i18n-placeholder="auth.passwordMin" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" aria-label="Show password" data-i18n-aria-label="auth.show">
            <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 2l20 20M9.9 9.9a3 3 0 0 0 4.2 4.2M6.2 6.2C3.5 7.9 1 12 1 12s4 7 11 7c1.8 0 3.4-.4 4.8-1.1M17.9 17.9C20.6 16.1 23 12 23 12s-1.6-3.1-4.5-5.2"/></svg>
          </button>
        </div>
      </label>
      <label class="field">
        <span data-i18n="reset.confirmNew">Confirm new password</span>
        <div class="password-field">
          <input type="password" name="password_confirm" placeholder="Type it again" data-i18n-placeholder="auth.typeAgain" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" aria-label="Show password" data-i18n-aria-label="auth.show">
            <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 2l20 20M9.9 9.9a3 3 0 0 0 4.2 4.2M6.2 6.2C3.5 7.9 1 12 1 12s4 7 11 7c1.8 0 3.4-.4 4.8-1.1M17.9 17.9C20.6 16.1 23 12 23 12s-1.6-3.1-4.5-5.2"/></svg>
          </button>
        </div>
      </label>
      <button type="submit" class="btn-primary auth-submit" data-i18n="reset.update">Update password</button>
    </form>

    <p class="auth-message" role="alert" hidden></p>

    <a class="auth-switch" href="reset-password-request.html" id="requestNewLink" data-i18n="reset.requestNew" hidden>Request a new reset link</a>
  </div>
</div>

<script>window.I18N && I18N.apply();</script>
</body>
</html>
