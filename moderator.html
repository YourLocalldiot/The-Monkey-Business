<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMS — The Monkey Business</title>
  <meta name="description" content="Moderator CMS: edit playlists, quizzes, videos and users.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="assets/js/supabase-client.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/moderator.js" defer></script>
  <script src="assets/js/moderator-playlists.js" defer></script>
  <script src="assets/js/moderator-quizzes.js" defer></script>
  <script src="assets/js/moderator-videos.js" defer></script>
  <script src="assets/js/moderator-users.js" defer></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="index.html" aria-label="The Monkey Business — Home">
      <img class="brand-mark" src="assets/images/monkeyHead.PNG" alt="">
      <span class="brand-name">The Monkey<br/>Business</span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      <a class="nav-item" href="index.html">
        <img class="nav-icon" src="assets/images/home.png" alt="">
        Home
      </a>
      <a class="nav-item" href="tracker.html">
        <img class="nav-icon" src="assets/images/tracker.png" alt="">
        Tracker
      </a>
      <a class="nav-item" href="simulation.html">
        <img class="nav-icon" src="assets/images/simulator.png" alt="">
        Trading Simulation
      </a>
      <a class="nav-item" href="browse-playlists.html">
        <img class="nav-icon" src="assets/images/files.png" alt="">
        Browse playlists
      </a>
      <a class="nav-item" href="marketplace.html">
        <img class="nav-icon" src="assets/images/marketplace.png" alt="">
        Marketplace
      </a>
      <!-- assets/js/auth.js reveals this only when the signed-in user's
           profile has role = 'moderator'. -->
      <a class="nav-item cms-link" href="moderator.html" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        CMS
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="light" aria-pressed="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        Light
      </button>
      <button type="button" data-theme-choice="dark" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.7A8 8 0 1 1 9.3 4a6.4 6.4 0 0 0 10.7 10.7Z"/></svg>
        Dark
      </button>
    </div>

    <div class="sidebar-account">
      <a class="nav-item profile-link" href="profile.html">
        <img class="nav-icon" src="assets/images/profile.png" alt="">
        Profile
      </a>
      <a class="login-btn" href="login.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Log in
      </a>
    </div>
  </aside>

  <main class="canvas">
    <div class="canvas-inner">

      <div class="topline">
        <div>
          <span class="eyebrow">Moderator tools</span>
          <h1 class="continue-title" style="margin-top: 6px;">CMS</h1>
        </div>
      </div>

      <p class="auth-message" id="cmsMessage" role="alert" hidden></p>

      <!-- Shown by assets/js/moderator.js once the signed-in user's profile
           has role = 'moderator'. Each pane below is filled in by its own
           script (moderator-playlists.js, ...). -->
      <div id="cmsApp" hidden>
        <div class="cms-tabs" role="tablist" aria-label="CMS sections">
          <button type="button" class="cms-tab" role="tab" id="tab-playlists" data-tab="playlists" aria-controls="pane-playlists" aria-selected="true">Playlists</button>
          <button type="button" class="cms-tab" role="tab" id="tab-quizzes" data-tab="quizzes" aria-controls="pane-quizzes" aria-selected="false" tabindex="-1">Quizzes</button>
          <button type="button" class="cms-tab" role="tab" id="tab-videos" data-tab="videos" aria-controls="pane-videos" aria-selected="false" tabindex="-1">Videos</button>
          <button type="button" class="cms-tab" role="tab" id="tab-users" data-tab="users" aria-controls="pane-users" aria-selected="false" tabindex="-1">Users</button>
        </div>

        <section class="cms-pane" id="pane-playlists" role="tabpanel" aria-labelledby="tab-playlists"></section>
        <section class="cms-pane" id="pane-quizzes" role="tabpanel" aria-labelledby="tab-quizzes" hidden></section>
        <section class="cms-pane" id="pane-videos" role="tabpanel" aria-labelledby="tab-videos" hidden></section>

        <section class="cms-pane" id="pane-users" role="tabpanel" aria-labelledby="tab-users" hidden>
          <div class="card cms-users">
            <h2 class="cms-editor-title">Users</h2>
            <p class="auth-sub">Look up a user by username to adjust their coins or streak.</p>

            <form class="auth-form" id="lookupForm">
              <label class="field">
                <span>Username</span>
                <input type="text" name="username" placeholder="khi_gioi_kinh_te" required>
              </label>
              <button type="submit" class="btn-primary auth-submit">Look up</button>
            </form>

            <div class="mod-result" id="modResult" hidden>
              <p class="mod-user">Editing <strong id="modUsername"></strong></p>
              <form class="auth-form" id="editForm">
                <label class="field">
                  <span>Currency (coins)</span>
                  <input type="number" name="coins" min="0" step="1" required>
                </label>
                <label class="field">
                  <span>Streak (days)</span>
                  <input type="number" name="streak" min="0" step="1" required>
                </label>
                <button type="submit" class="btn-primary auth-submit">Save changes</button>
              </form>
            </div>

            <p class="auth-message" id="usersMessage" role="status" hidden></p>
          </div>
        </section>
      </div>

    </div>
  </main>
</div>

</body>
</html>
