<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — The Monkey Business</title>
  <meta name="description" content="Create a The Monkey Business account.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="assets/js/supabase-client.js" defer></script>
  <script src="assets/js/password-toggle.js" defer></script>
  <script src="assets/js/signup.js" defer></script>
</head>
<body class="auth-body">

<div class="auth-shell">
  <a class="auth-brand" href="index.html">
    <img class="auth-brand-mark" src="assets/images/logo-mark.png" alt="">
    <span>The Monkey Business</span>
  </a>

  <div class="auth-card">
    <h1>Sign up</h1>
    <p class="auth-sub">Start learning and earning banamoney today.</p>

    <form class="auth-form" action="#" method="post">
      <div class="field-row">
        <label class="field">
          <span>First name</span>
          <input type="text" name="first_name" placeholder="Linh" autocomplete="given-name" required>
        </label>
        <label class="field">
          <span>Last name</span>
          <input type="text" name="last_name" placeholder="Nguyễn" autocomplete="family-name" required>
        </label>
      </div>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" placeholder="khi_gioi_kinh_te" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required>
        <span class="field-hint">3–24 characters: letters, numbers, underscores only.</span>
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <div class="password-field">
          <input type="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 2l20 20M9.9 9.9a3 3 0 0 0 4.2 4.2M6.2 6.2C3.5 7.9 1 12 1 12s4 7 11 7c1.8 0 3.4-.4 4.8-1.1M17.9 17.9C20.6 16.1 23 12 23 12s-1.6-3.1-4.5-5.2"/></svg>
          </button>
        </div>
      </label>
      <label class="field">
        <span>Confirm password</span>
        <div class="password-field">
          <input type="password" name="password_confirm" placeholder="Type it again" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 2l20 20M9.9 9.9a3 3 0 0 0 4.2 4.2M6.2 6.2C3.5 7.9 1 12 1 12s4 7 11 7c1.8 0 3.4-.4 4.8-1.1M17.9 17.9C20.6 16.1 23 12 23 12s-1.6-3.1-4.5-5.2"/></svg>
          </button>
        </div>
      </label>
      <button type="submit" class="btn-primary auth-submit">Sign up</button>
    </form>

    <p class="auth-message" role="alert" hidden></p>

    <a class="auth-switch" href="login.html">Already have an account? <strong>Log in</strong></a>
  </div>
</div>

</body>
</html>
