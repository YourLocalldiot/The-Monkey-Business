<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — The Monkey Business</title>
  <meta name="description" content="Log in to The Monkey Business.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
</head>
<body class="auth-body">

<div class="auth-shell">
  <a class="auth-brand" href="index.html">
    <img class="auth-brand-mark" src="assets/images/logo-mark.png" alt="">
    <span>The Monkey Business</span>
  </a>

  <div class="auth-card">
    <h1>Log in</h1>
    <p class="auth-sub">Welcome back — pick up where you left off.</p>

    <!-- No backend yet: this form doesn't submit anywhere real.
         See docs/supabase-setup.md for how this wires up to Supabase Auth. -->
    <form class="auth-form" action="#" method="post">
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primary auth-submit">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account yet? <a href="signup.html">Sign up</a></p>
    <p class="auth-note">Authentication isn't connected yet — this is a placeholder for the real sign-in flow.</p>
  </div>
</div>

</body>
</html>
