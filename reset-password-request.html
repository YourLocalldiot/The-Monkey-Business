<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.resetRequest.title">Reset password — The Monkey Business</title>
  <meta name="description" data-i18n-content="page.resetRequest.desc" content="Request a password reset link.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="assets/js/i18n-strings.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="assets/js/supabase-client.js" defer></script>
  <script src="assets/js/auth-errors.js" defer></script>
  <script src="assets/js/reset-password-request.js" defer></script>
</head>
<body class="auth-body">

<div class="auth-shell">
  <a class="auth-brand" href="index.html">
    <img class="auth-brand-mark" src="assets/images/logo-mark.png" alt="">
    <span>The Monkey Business</span>
  </a>

  <div class="auth-card">
    <h1 data-i18n="resetReq.title">Reset your password</h1>
    <p class="auth-sub" data-i18n="resetReq.sub">Enter your email and we'll send you a reset link.</p>

    <form class="auth-form" action="#" method="post">
      <label class="field">
        <span data-i18n="auth.email">Email</span>
        <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </label>
      <button type="submit" class="btn-primary auth-submit" data-i18n="resetReq.button">Send reset link</button>
    </form>

    <p class="auth-message" role="alert" hidden></p>

    <a class="auth-switch" href="login.html" data-i18n="resetReq.back">Remembered it after all? <strong data-i18n="auth.login">Log in</strong></a>
  </div>
</div>

<script>window.I18N && I18N.apply();</script>
</body>
</html>
