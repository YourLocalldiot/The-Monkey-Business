<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.browse.title">Browse playlists — The Monkey Business</title>
  <meta name="description" data-i18n-content="page.browse.desc" content="Every video playlist, in one place.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script src="assets/js/i18n-strings.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/sidebar.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="assets/js/supabase-client.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/browse-playlists.js" defer></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="index.html" aria-label="The Monkey Business — Home" data-i18n-aria-label="brand.home">
      <img class="brand-mark" src="assets/images/monkeyHead.PNG" alt="">
      <span class="brand-name">The Monkey Business</span>
    </a>

    <nav class="primary-nav" aria-label="Primary" data-i18n-aria-label="nav.primary">
      <a class="nav-item" href="index.html" data-i18n="nav.home">
        <img class="nav-icon" src="assets/images/home.png" alt="">
        Home
      </a>
      <a class="nav-item" href="tracker.html" data-i18n="nav.tracker">
        <img class="nav-icon" src="assets/images/tracker.png" alt="">
        Tracker
      </a>
      <a class="nav-item" href="simulation.html" data-i18n="nav.simulation">
        <img class="nav-icon" src="assets/images/simulator.png" alt="">
        Trading Simulation
      </a>
      <a class="nav-item" href="browse-playlists.html" data-i18n="nav.browse" aria-current="page">
        <img class="nav-icon" src="assets/images/files.png" alt="">
        Browse playlists
      </a>
      <a class="nav-item" href="marketplace.html" data-i18n="nav.marketplace">
        <img class="nav-icon" src="assets/images/marketplace.png" alt="">
        Marketplace
      </a>
      <!-- assets/js/auth.js reveals this only when the signed-in user's
           profile has role = 'moderator'. -->
      <a class="nav-item cms-link" href="moderator.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        CMS
      </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-account">
      <a class="nav-item profile-link" href="profile.html" data-i18n="nav.profile">
        <img class="nav-icon" src="assets/images/profile.png" alt="">
        Profile
      </a>
      <a class="login-btn" href="login.html" data-i18n="nav.login">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Log in
      </a>
    </div>
  </aside>

  <main class="canvas">
    <div class="canvas-inner">

      <div class="topline">
        <div>
          <span class="eyebrow" data-i18n="browse.eyebrow">Every playlist, one place</span>
          <h1 class="continue-title" style="margin-top: 6px;" data-i18n="browse.title">Browse playlists</h1>
        </div>
      </div>

      <p class="auth-message" id="playlistsMessage" role="alert" hidden></p>

      <div class="grid">
        <div class="main-col" style="display:flex; flex-direction:column; gap:22px;">
          <section class="card">
            <div class="trail-head">
              <h2 data-i18n="browse.all">All playlists</h2>
            </div>
            <div id="playlistList" style="margin-top: 14px;"></div>
          </section>
        </div>
      </div>

    </div>
  </main>
</div>

<script>window.I18N && I18N.apply();</script>
</body>
</html>
